<!DOCTYPE html>
<html>
<head><title>Create Order</title></head>
<body>
<h1>Create Order</h1>
<form method="post">
  {% csrf_token %}
  <label>Customer ID: <input type="number" name="customer_id" required></label><br>
  <label>Payment Method: <input type="text" name="pay_method" required></label><br>
  <label>Shipping Method: <input type="text" name="ship_method" required></label><br>
  <label>Shipping Address: <input type="text" name="shipping_address" required></label><br>
  <button type="submit">Create Order</button>
</form>
</body>
</html>
